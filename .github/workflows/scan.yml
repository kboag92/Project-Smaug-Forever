name: Auction scan

on:
  schedule:
    # Once an hour, just after Blizzard publishes the US auction file around :17.
    # A quarter-hour workflow_dispatch from outside this repo still scans the old file.
    # Move that dispatcher to 20 minutes past the hour as well.
    - cron: "20 * * * *"
  workflow_dispatch:

# One scan at a time. A slow run waits, and an older waiting run is dropped.
concurrency:
  group: auction-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Scan the auction house
        run: npm start
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
