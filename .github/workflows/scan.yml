name: Auction scan

on:
  schedule:
    # Every 15 minutes, offset from :00/:15/:30/:45.
    # GitHub often delays or drops runs that start on those busy minutes.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# One scan at a time. A slow run waits, and an older waiting run is dropped.
concurrency:
  group: auction-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Scan the auction house
        run: npm start
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
