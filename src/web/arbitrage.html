<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbitrage</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Georgia, serif; background: #1a140c; color: #f3e6c8; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-weight: normal; font-size: 28px; margin: 0 0 8px; }
    a { color: #e0b44f; }
    p, #count { color: #cbb892; }
    input, button { font: inherit; background: #2a2116; color: inherit; border: 1px solid #6b5428; padding: 8px 12px; }
    button.on { background: #8a6a2f; color: #fff8e8; }
    .bar { display: flex; gap: 8px; align-items: center; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #6b5428; white-space: nowrap; }
    th { color: #cbb892; font-size: 12px; cursor: pointer; }
    td.num, th.num { text-align: right; }
    td.buy { color: #7dcea0; } td.sell { color: #f0635a; }
    #rows tr { cursor: pointer; }
    .item-icon { width: 24px; height: 24px; margin-right: 8px; vertical-align: middle; image-rendering: pixelated; }
    .coin { display: inline-flex; align-items: center; margin-left: 4px; }
    .coin-icon { width: 14px; height: 14px; margin-left: 2px; }
  </style>
</head>
<body>
  <main>
    <h1><a href="index.html">Prices</a> · <a href="cycles.html">Cycles</a> · Arbitrage</h1>
    <p>Buy at one house's P10 and list at the other's P10. You receive 95% of the sale. Liquid hides a side with fewer than 10 units.</p>
    <div class="bar">
      <input id="search" placeholder="Search item" autocomplete="off">
      <button id="liquid" class="on" type="button">Liquid</button>
      <button id="all" type="button">All</button>
    </div>
    <p id="count">Loading cross-sells…</p>
    <table>
      <thead>
        <tr>
          <th data-sort="name">Item</th>
          <th data-sort="direction">Direction</th>
          <th class="num" data-sort="buy">Buy</th>
          <th class="num" data-sort="sell">Sell</th>
          <th class="num" data-sort="receive">You receive</th>
          <th class="num" data-sort="edge">Edge</th>
          <th class="num" data-sort="buyQty">Buy qty</th>
          <th class="num" data-sort="sellQty">Sell qty</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="arbitrage-score.js"></script>
  <script src="arbitrage.js"></script>
</body>
</html>
