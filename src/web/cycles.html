<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cycles</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Georgia, serif; background: #1a140c; color: #f3e6c8; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-weight: normal; font-size: 28px; margin: 0 0 8px; }
    a { color: #e0b44f; }
    p, #count { color: #cbb892; }
    input, button { font: inherit; background: #2a2116; color: inherit; border: 1px solid #6b5428; padding: 8px 12px; }
    button.on { background: #8a6a2f; color: #fff8e8; }
    .bar { display: flex; gap: 8px; align-items: center; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #6b5428; white-space: nowrap; }
    th { color: #cbb892; font-size: 12px; cursor: pointer; }
    td.num, th.num { text-align: right; }
    td.cheap, td.low { color: #7dcea0; }
    td.rich, td.high { color: #f0635a; }
    td.buy { color: #7dcea0; } td.sell { color: #f0635a; }
    #rows tr { cursor: pointer; }
    .item-icon { width: 24px; height: 24px; margin-right: 8px; vertical-align: middle; image-rendering: pixelated; }
    .coin { display: inline-flex; align-items: center; margin-left: 4px; }
    .coin-icon { width: 14px; height: 14px; margin-left: 2px; }
  </style>
</head>
<body>
  <main>
    <h1><a href="index.html">Prices</a> · Cycles · <a href="arbitrage.html">Arbitrage</a></h1>
    <p>Low is the P10 dip. High is the typical ask. Now is where the latest P10 sits in that swing. Edge is what is left after the 5% auction cut.</p>
    <div class="bar">
      <input id="search" placeholder="Search item" autocomplete="off">
      <button id="liquid" class="on" type="button">Liquid</button>
      <button id="all" type="button">All</button>
    </div>
    <p id="count">Loading cycles…</p>
    <table>
      <thead>
        <tr>
          <th data-sort="name" title="Click a row to open its chart">Item</th>
          <th data-sort="cheap" title="8-hour window where P10 is lowest">Cheap</th>
          <th class="num" data-sort="low" title="Median P10 inside the Cheap window">Low</th>
          <th data-sort="rich" title="Non-overlapping window where the typical ask is highest">Rich</th>
          <th class="num" data-sort="high" title="Median ask inside the Rich window">High</th>
          <th class="num" data-sort="edge" title="High after the 5% cut, minus Low">Edge</th>
          <th class="num" data-sort="swing" title="High versus Low. Only 10%+ swings are listed">Swing</th>
          <th data-sort="phase" title="BUY is the bottom third of the swing. SELL is the top third">Now</th>
          <th class="num" data-sort="conf" title="How often the cheap side is below the rich side">Conf</th>
          <th class="num" data-sort="days">Days</th>
          <th class="num" data-sort="avgQty" title="Average listed quantity. Liquid hides anything under 3">Avg Qty</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="cycles-score.js"></script>
  <script src="cycles.js"></script>
</body>
</html>
