<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forever auction prices</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Georgia, serif; background: #1a140c; color: #f3e6c8; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-weight: normal; font-size: 28px; margin: 0 0 8px; }
    p { color: #cbb892; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px 12px; font: inherit; background: #2a2116; color: inherit; border: 1px solid #6b5428; }
    button { font: inherit; background: #8a6a2f; color: #fff8e8; border: 0; padding: 10px 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0 0 24px; }
    li + li { margin-top: 8px; }
    li button { width: 100%; text-align: left; background: #2a2116; border: 1px solid #6b5428; display: flex; align-items: center; flex-wrap: wrap; }
    .item-icon { width: 28px; height: 28px; margin-right: 8px; image-rendering: pixelated; }
    .coin { display: inline-flex; align-items: center; margin-left: 4px; }
    .coin-icon { width: 14px; height: 14px; margin-left: 2px; }
    #chart-wrap { background: #241c12; border: 1px solid #6b5428; padding: 16px; min-height: 360px; }
    #status { min-height: 1.4em; }
    #alerts { margin: 16px 0 28px; }
    #alerts h2 { font-weight: normal; font-size: 22px; margin: 0; cursor: pointer; } #alert-badge { background: #8a6a2f; border-radius: 10px; padding: 0 8px; font-size: 14px; }
    #alert-search { max-width: 240px; margin: 8px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #6b5428; }
    th { color: #cbb892; font-size: 12px; cursor: pointer; }
    td.above { color: #7dcea0; } td.below { color: #f0635a; } td.watch { color: #e0b44f; } a { color: #e0b44f; }
    tr.unread { background: rgba(224, 180, 79, 0.14); }
    #alert-rows tr { cursor: pointer; }
    td button.x { width: auto; background: transparent; color: #f0635a; padding: 0 8px; }
    #status { display: flex; align-items: center; }
  </style>
</head>
<body>
  <main>
    <h1>Forever auction prices</h1>
    <p>Search a name or an item id. Click the chart to set a P10 alert. <a href="cycles.html">Cycles</a> lists daily dips and peaks.</p>
    <button id="allow" type="button">Allow desktop alerts</button>
    <section id="alerts">
      <h2 id="alerts-title">Alerts <span id="alert-badge" hidden></span></h2>
      <p>Watches stay until you remove them. ABOVE and BELOW are crosses. Click a row for its chart. Click Alerts to mark fires read.</p>
      <input id="alert-search" placeholder="Search alerts" autocomplete="off">
      <p id="alert-count"></p>
      <table>
        <thead id="alert-head">
          <tr>
            <th data-sort="kind">Type</th>
            <th data-sort="name">Item</th>
            <th data-sort="price">Level</th>
            <th data-sort="last">P10</th>
            <th data-sort="time">When</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="alert-rows"></tbody>
      </table>
    </section>
    <form id="search-form">
      <input id="query" name="q" placeholder="Item name or id" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <p id="recent-label" hidden>Recent</p>
    <ul id="recent"></ul>
    <p id="status"></p>
    <ul id="results"></ul>
    <div id="chart-wrap">
      <canvas id="chart" height="140"></canvas>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="graph.js"></script>
  <script src="recent.js"></script>
  <script src="alert-list.js"></script>
  <script src="alerts.js"></script>
  <script>
    const statusNode = document.querySelector("#status");
    const resultsNode = document.querySelector("#results");
    const queryNode = document.querySelector("#query");
    let chart;
    let currentHit = null;
    let currentPoints = [];
    const alerts = PriceAlerts.bind({
      hit: () => currentHit,
      redraw: () => { if (currentPoints.length) draw(currentPoints); },
      open: (row) => {
        queryNode.value = String(row.itemId);
        document.querySelector("#search-form").requestSubmit();
      },
    });

    function draw(points) {
      currentPoints = points;
      if (chart) chart.destroy();
      const watches = currentHit ? PriceAlerts.watchesFor(currentHit.itemId, currentHit.houseId) : [];
      chart = PriceChart.draw(document.querySelector("#chart"), points, {
        watches,
        formatCopper: alerts.formatCopper,
        onClickY: setAlertAt,
      });
    }

    function setAlertAt(pixelY) {
      if (!currentHit || !currentPoints.length || !chart) return;
      const copper = Math.round(chart.scales.y.getValueForPixel(pixelY) * 10000);
      const last = currentPoints[currentPoints.length - 1];
      const result = PriceAlerts.addWatch(currentHit, copper, last.p10_price, last.scanned_at);
      statusNode.replaceChildren(document.createTextNode(result.ok ? "Alert: P10 crosses " : result.reason));
      if (result.ok) AuctionData.paintMoney(statusNode, copper);
      if (!result.ok) return;
      draw(currentPoints);
      alerts.renderWatches();
    }

    async function showHistory(hit, remember) {
      if (remember) recent.remember({ query: queryNode.value, itemId: hit.itemId, houseId: hit.houseId, name: hit.name, icon: hit.icon, p10: hit.p10 });
      statusNode.textContent = "Loading " + (hit.name || "item " + hit.itemId) + "…";
      let points;
      try {
        points = await AuctionData.history(hit.itemId, hit.houseId);
      } catch (error) {
        statusNode.textContent = error.message || "Could not load the graph.";
        return;
      }
      if (!points.length) {
        currentHit = null;
        currentPoints = [];
        statusNode.textContent = "No scans stored for this item yet.";
        if (chart) chart.destroy();
        alerts.renderWatches();
        return;
      }
      currentHit = hit;
      AuctionData.face(statusNode, hit.icon, (hit.name || "Item " + hit.itemId) + " · " + points.length + " scans · latest P10 ");
      AuctionData.paintMoney(statusNode, hit.p10);
      statusNode.append(document.createTextNode(" · click the chart to set an alert"));
      draw(points);
      alerts.renderWatches();
    }

    // A saved house id can be the old book. Search again so the chart uses the listed house.
    const recent = RecentSearches.mount(document.querySelector("#recent"), document.querySelector("#recent-label"), (row) => {
      queryNode.value = row.itemId ? String(row.itemId) : row.query;
      document.querySelector("#search-form").requestSubmit();
    });

    function showResults(results) {
      resultsNode.replaceChildren();
      if (!results.length) {
        statusNode.textContent = "No matching items. Try an item id, or a name that has already been stored.";
        return;
      }
      statusNode.textContent = results.length + " match" + (results.length === 1 ? "" : "es") + ".";
      for (const hit of results) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        AuctionData.face(button, hit.icon, (hit.name || "Item " + hit.itemId) + " · #" + hit.itemId + " · P10 ");
        AuctionData.paintMoney(button, hit.p10);
        button.addEventListener("click", () => showHistory(hit, true));
        item.append(button);
        resultsNode.append(item);
      }
      if (results.length === 1) showHistory(results[0], true);
      else recent.remember({ query: queryNode.value });
    }
    document.querySelector("#search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      statusNode.textContent = "Searching…";
      try {
        showResults(await AuctionData.search(queryNode.value));
      } catch (error) {
        statusNode.textContent = error.message || "Search failed.";
      }
    });
    const openItem = new URLSearchParams(location.search).get("item");
    if (openItem) { queryNode.value = openItem; document.querySelector("#search-form").requestSubmit(); }
  </script>
</body>
</html>
